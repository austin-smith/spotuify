name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run typecheck

      - name: Test TypeScript
        run: bun test

      - name: Test POSIX installer
        run: bun run installer:test:posix

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: bun run engine:test

  licensing:
    name: Licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned license tools
        run: |
          cargo install --locked --version 0.9.1 cargo-about --features cli
          cargo install --locked --version 0.20.2 cargo-deny

      - name: Check third-party licensing
        run: bun run licenses:check

  release-smoke:
    name: Linux release smoke test
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: bun run release:build linux-x64

      - name: Package release
        run: bun run release:package linux-x64

      - name: Verify release
        run: bun run release:verify linux-x64

      - name: Package npm binaries
        run: bun run release:npm:package linux-x64

      - name: Verify npm binaries
        run: bun run release:npm:verify linux-x64

      - name: Package and verify npm launcher
        run: |
          bun run release:npm:package root
          bun run release:npm:verify root
          bun run release:npm:smoke linux-x64

  macos-release-smoke:
    name: macOS release smoke test
    needs: quality
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: bun run release:build darwin-arm64

      - name: Package release
        run: bun run release:package darwin-arm64

      - name: Verify release
        run: bun run release:verify darwin-arm64

      - name: Package npm binaries
        run: bun run release:npm:package darwin-arm64

      - name: Verify npm binaries
        run: bun run release:npm:verify darwin-arm64

      - name: Package and verify npm launcher
        run: |
          bun run release:npm:package root
          bun run release:npm:verify root
          bun run release:npm:smoke darwin-arm64

  windows-release-smoke:
    name: Windows release smoke test
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test PowerShell installer
        shell: powershell
        run: ./test/installer-windows.tests.ps1

      - name: Package and verify npm launcher
        run: |
          bun run release:npm:package root
          bun run release:npm:verify root

      - name: Build release
        run: bun run release:build windows-x64

      - name: Package release
        run: bun run release:package windows-x64

      - name: Verify release
        run: bun run release:verify windows-x64

      - name: Package npm binaries
        run: bun run release:npm:package windows-x64

      - name: Verify npm binaries
        run: bun run release:npm:verify windows-x64

      - name: Verify npm launcher
        run: bun run release:npm:smoke windows-x64

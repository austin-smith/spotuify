name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run typecheck

      - name: Test TypeScript
        run: bun test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: bun run engine:test

      - name: Install pinned license tools
        run: |
          cargo install --locked --version 0.9.1 cargo-about --features cli
          cargo install --locked --version 0.20.2 cargo-deny

      - name: Check third-party licensing
        run: bun run licenses:check

  release-smoke:
    name: Linux release smoke test
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: bun run release:build linux-x64

      - name: Package release
        run: bun run release:package linux-x64

      - name: Verify release
        run: bun run release:verify linux-x64

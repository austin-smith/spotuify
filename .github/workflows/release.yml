name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.publication.outputs.channel }}
      version: ${{ steps.publication.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bun run release:validate-tag "$GITHUB_REF_NAME"
            tag_commit="$(git rev-list --max-count=1 "$GITHUB_REF_NAME")"
            if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
              echo "$GITHUB_REF_NAME does not point to a commit on main" >&2
              exit 1
            fi
            channel=stable
            version="${GITHUB_REF_NAME#v}"
          else
            channel=canary
            run_created_at="$(
              gh api \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                --jq .created_at
            )"
            version="$(bun scripts/canary-version.ts "$GITHUB_RUN_NUMBER" "$run_created_at")"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing spotuify $version to npm's $channel channel"

      - name: Check and test TypeScript
        run: bun run typecheck && bun test

      - name: Test POSIX installer
        run: bun run installer:test:posix

      - name: Check and test Rust
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          bun run engine:test

      - name: Install pinned license tools
        run: |
          cargo install --locked --version 0.9.1 cargo-about --features cli
          cargo install --locked --version 0.20.2 cargo-deny

      - name: Check third-party licensing
        run: bun run licenses:check

  linux:
    name: Linux ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: bun run release:build "${{ matrix.target }}"

      - name: Package release
        run: bun run release:package "${{ matrix.target }}"

      - name: Verify release
        run: bun run release:verify "${{ matrix.target }}"

      - name: Package npm binaries
        run: bun run release:npm:package "${{ matrix.target }}"

      - name: Verify npm binaries
        run: bun run release:npm:verify "${{ matrix.target }}"

      - name: Upload release outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*-standalone-*
            dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Apple silicon
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release
        run: bun run release:build darwin-arm64

      - name: Sign and notarize
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/sign-and-notarize-macos.sh "dist/stage/spotuify-v${SPOTUIFY_BUILD_VERSION}-darwin-arm64"

      - name: Package release
        run: bun run release:package darwin-arm64

      - name: Verify release
        run: bun run release:verify darwin-arm64

      - name: Package npm binaries
        run: bun run release:npm:package darwin-arm64

      - name: Verify npm binaries
        run: bun run release:npm:verify darwin-arm64

      - name: Upload release outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-darwin-arm64
          path: |
            dist/*.tar.gz
            dist/*-standalone-*
            dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test PowerShell installer
        shell: powershell
        run: ./test/installer-windows.tests.ps1

      - name: Build release
        run: bun run release:build windows-x64

      - name: Package release
        run: bun run release:package windows-x64

      - name: Verify release
        run: bun run release:verify windows-x64

      - name: Package npm binaries
        run: bun run release:npm:package windows-x64

      - name: Verify npm binaries
        run: bun run release:npm:verify windows-x64

      - name: Upload release outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: |
            dist/*.zip
            dist/*-standalone-*
            dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm-packages:
    name: Assemble npm packages
    needs:
      - validate
      - linux
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Package npm launcher
        run: bun run release:npm:package root

      - name: Verify npm packages
        run: bun run release:npm:verify all

      - name: Upload npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Publish stable GitHub release
    if: needs.validate.outputs.channel == 'stable'
    needs:
      - validate
      - npm-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Stage standalone installers
        run: |
          install -m 0755 packaging/standalone/install.sh dist/install.sh
          install -m 0644 packaging/standalone/install.ps1 dist/install.ps1

      - name: Package release source
        run: bun run release:package-source

      - name: Generate checksums and Homebrew candidate
        run: |
          bun run release:checksums
          bun run release:formula

      - name: Upload Homebrew candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-candidate
          path: |
            dist/spotuify.rb
            dist/spotuify.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "$GITHUB_REF_NAME is already published; leaving its assets unchanged"
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/*.zip dist/*-standalone-* dist/install.sh dist/install.ps1 \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/*.zip dist/*-standalone-* dist/install.sh dist/install.ps1 \
              dist/SHA256SUMS \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            echo "$GITHUB_REF_NAME is already published"
          fi

  public-installer-smoke:
    name: Public installer smoke test (${{ matrix.name }})
    if: needs.validate.outputs.channel == 'stable'
    needs:
      - validate
      - publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: POSIX
            runner: ubuntu-24.04
            kind: posix
          - name: Windows
            runner: windows-2025
            kind: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Install through crapshack.net
        if: matrix.kind == 'posix'
        env:
          SPOTUIFY_INSTALL_PREFIX: ${{ runner.temp }}/spotuify
          SPOTUIFY_NO_MODIFY_PATH: "1"
          SPOTUIFY_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          curl --retry 5 --retry-all-errors -fsSL \
            https://crapshack.net/spotuify/install.sh | sh
          test "$("$SPOTUIFY_INSTALL_PREFIX/bin/spotuify" --version)" = \
            "spotuify $SPOTUIFY_VERSION"
          test "$("$SPOTUIFY_INSTALL_PREFIX/libexec/spotuify-engine" --version)" = \
            "spotuify-engine $SPOTUIFY_VERSION"
          "$SPOTUIFY_INSTALL_PREFIX/bin/spotuify" update --check

      - name: Install through crapshack.net
        if: matrix.kind == 'windows'
        shell: powershell
        env:
          SPOTUIFY_NO_MODIFY_PATH: "1"
          SPOTUIFY_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $env:SPOTUIFY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'spotuify'
          $installerSource = $null
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $installerSource = Invoke-RestMethod `
                -Uri 'https://crapshack.net/spotuify/install.ps1' `
                -UseBasicParsing `
                -TimeoutSec 60
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $installerSource | Invoke-Expression
          $binDirectory = Join-Path $env:SPOTUIFY_INSTALL_DIR 'bin'
          $mainVersion = & (Join-Path $binDirectory 'spotuify.exe') --version
          $currentRelease = (Get-Content -LiteralPath (Join-Path $env:SPOTUIFY_INSTALL_DIR 'current') -Raw).Trim()
          $engineVersion = & (Join-Path $env:SPOTUIFY_INSTALL_DIR "releases\$currentRelease\spotuify-engine.exe") --version
          if ($mainVersion -cne "spotuify $env:SPOTUIFY_VERSION") {
            throw "Unexpected Spotuify version: $mainVersion"
          }
          if ($engineVersion -cne "spotuify-engine $env:SPOTUIFY_VERSION") {
            throw "Unexpected Spotuify engine version: $engineVersion"
          }
          & (Join-Path $binDirectory 'spotuify.exe') update --check
          if ($LASTEXITCODE -ne 0) { throw 'Standalone update check failed.' }

  homebrew:
    name: Open Homebrew formula pull request
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Homebrew candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-candidate
          path: dist/homebrew

      - name: Open or update tap pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: >-
          bun run release:publish-formula
          dist/homebrew/spotuify.rb
          dist/homebrew/spotuify.json

  npm-canary:
    name: Publish npm canary
    if: needs.validate.outputs.channel == 'canary'
    needs:
      - validate
      - npm-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist/npm

      - name: Publish npm packages
        run: bun run release:npm:publish --tag canary

  npm-stable:
    name: Publish npm stable
    if: needs.validate.outputs.channel == 'stable'
    needs:
      - validate
      - npm-packages
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SPOTUIFY_BUILD_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Set up Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: dist/npm

      - name: Publish npm packages
        run: bun run release:npm:publish --tag latest

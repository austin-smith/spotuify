[package]
name = "spotuify-engine"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
librespot-connect = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
sysinfo = "=0.39.6"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.24.0", features = ["v4"] }

# librespot-core 0.8.0's build script is incompatible with vergen 9.1. Pin the last compatible
# resolver range until a published librespot release removes that constraint.
[build-dependencies]
vergen = { version = ">=9.0.6, <9.1", default-features = false }

[lints.rust]
unsafe_code = "deny"
